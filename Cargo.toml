[package]
name = "sentinelle"
version = "0.1.0"
edition = "2021"
description = "Locks (encrypts) folders holding sensitive data to protect them from stealers."

[[bin]]
name = "sentinelle"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
rand = "0.8.5"
rpassword = "7.3.1"
walkdir = "2.5.0"
zeroize = "1.8.1"
anyhow = "1.0.95"
base64 = "0.22.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_RemoteDesktop",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
]

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
